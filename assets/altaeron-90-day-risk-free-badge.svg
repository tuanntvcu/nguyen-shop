<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384" role="img" aria-labelledby="title desc">
  <title id="title">90-Day Risk-Free Guarantee</title>
  <desc id="desc">Circular Altaeron guarantee seal</desc>
  <defs>
    <pattern id="engraving" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
      <path d="M0 3.2H4" stroke="#173d38" stroke-width="0.65" opacity="0.52"/>
    </pattern>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.3" dy="1.3" stdDeviation="0" flood-color="#173d38" flood-opacity="0.95"/>
    </filter>
  </defs>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <circle cx="192" cy="192" r="163" stroke-width="2"/>
    <circle cx="192" cy="192" r="157" stroke-width="1.5"/>
    <circle cx="192" cy="192" r="152" stroke-width="3"/>
  </g>
  <g fill="url(#engraving)" stroke="#fff" stroke-width="1.4" paint-order="stroke fill" text-anchor="middle" filter="url(#edge)" font-family="Impact, 'Arial Narrow', Arial, sans-serif" font-weight="900">
    <text x="192" y="174" font-size="74" letter-spacing="-1.8">90-DAY</text>
    <text x="192" y="240" font-size="66" letter-spacing="-2">RISK-FREE</text>
    <text x="192" y="282" font-size="31" letter-spacing="0.4">GUARANTEE</text>
  </g>
</svg>
